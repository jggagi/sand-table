<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="从一处入口，走进留园、网师园、拙政园、狮子林与沧浪亭的艺术微缩园景。">
  <title>掌上园林 · 苏州五园</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='3' fill='%238e4937'/%3E%3Ctext x='20' y='28' text-anchor='middle' font-size='26' fill='%23ffffff'%3E园%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="identity"><span class="seal" aria-hidden="true">游<span>园</span></span><div><p class="eyebrow">SUZHOU · GARDENS IN MINIATURE</p><h1>掌上园林</h1></div></div>
      <p class="intro">五座园，五重山水。<span>选择一座，慢慢看。</span></p>
    </header>
    <main aria-label="选择苏州园林">
      <div class="garden-grid">
        <a class="garden-card featured" href="https://liuyuan-miniature-m1.jggagi.chatgpt.site/" aria-label="进入掌上留园，文人画意">
          <div class="image-frame"><img src="assets/liuyuan.jpg" alt="留园微缩景观：池水、转折回廊与冠云峰庭院" width="1312" height="656" fetchpriority="high"></div>
          <div class="card-copy"><div class="card-heading"><span class="index">一</span><h2>留园</h2><span class="enter">入园</span></div><p class="theme">文人画意</p><p class="description">水面舒展，廊院层叠，奇石独立。</p></div>
        </a>
        <a class="garden-card" href="https://wangshiyuan-miniature.jggagi.chatgpt.site/" aria-label="进入掌上网师园，小园大境">
          <div class="image-frame"><img src="assets/wangshiyuan.jpg" alt="网师园微缩景观：小池、六角亭与月洞庭院" width="1312" height="656" decoding="async"></div>
          <div class="card-copy"><div class="card-heading"><span class="index">二</span><h2>网师园</h2><span class="enter">入园</span></div><p class="theme">小园大境</p><p class="description">一池留白，几重亭廊，院深一隅。</p></div>
        </a>
        <a class="garden-card" href="https://zhuozhengyuan-miniature.jggagi.chatgpt.site/" aria-label="进入掌上拙政园，疏朗水乡">
          <div class="image-frame"><img src="assets/zhuozhengyuan.jpg" alt="拙政园微缩景观：广池、树岛、远堂与折桥" width="1312" height="656" decoding="async"></div>
          <div class="card-copy"><div class="card-heading"><span class="index">三</span><h2>拙政园</h2><span class="enter">入园</span></div><p class="theme">疏朗水乡</p><p class="description">池接树岛，曲桥牵起远堂与小亭。</p></div>
        </a>
        <a class="garden-card" href="https://shizilin-miniature.jggagi.chatgpt.site/" aria-label="进入掌上狮子林，石境回转">
          <div class="image-frame"><img src="assets/shizilin.jpg" alt="狮子林微缩景观：连续洞壑、岩上桥与池亭" width="1312" height="656" decoding="async"></div>
          <div class="card-copy"><div class="card-heading"><span class="index">四</span><h2>狮子林</h2><span class="enter">入园</span></div><p class="theme">石境回转</p><p class="description">石中藏路，岩间架桥，清水留白。</p></div>
        </a>
        <a class="garden-card" href="https://canglangting-miniature.jggagi.chatgpt.site/" aria-label="进入掌上沧浪亭，水外山林">
          <div class="image-frame"><img src="assets/canglangting.jpg" alt="沧浪亭微缩景观：沿边外河、复廊、丘亭与密林" width="1312" height="656" decoding="async"></div>
          <div class="card-copy"><div class="card-heading"><span class="index">五</span><h2>沧浪亭</h2><span class="enter">入园</span></div><p class="theme">水外山林</p><p class="description">河在园外，亭在丘上，复廊两望。</p></div>
        </a>
      </div>
    </main>
    <footer><p>入园后，拖动旋转、缩放细看；亦可选择四个观景点。</p><span>艺术化微缩 · 非等比例复原</span></footer>
  </div>
</body>
</html>
